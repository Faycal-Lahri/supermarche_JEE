<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="L'Épicerie Moderne — Courses fraîches, livrées en 2h. Fruits, légumes, viandes, fromagerie et épicerie fine sélectionnés avec soin." />
    <title>L'Épicerie Moderne</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <!-- Tailwind CDN with design system config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0059b5',
              'primary-container': '#0071e3',
              'on-primary': '#ffffff',
              'surface': '#f9f9fb',
              'surface-low': '#f3f3f5',
              'surface-lowest': '#ffffff',
              'surface-container': '#eeeef0',
              'surface-high': '#e8e8ea',
              'on-surface': '#1a1c1d',
              'on-surface-variant': '#414753',
              'outline': '#717785',
              'outline-variant': '#c1c6d6',
              'error': '#ba1a1a',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#6f001b",
                        "surface-container-low": "#131313",
                        "on-primary-fixed": "#000000",
                        "on-error-container": "#ffa8a3",
                        "outline-variant": "#494847",
                        "outline": "#777575",
                        "surface-bright": "#2c2c2c",
                        "surface-variant": "#262626",
                        "on-secondary": "#49000f",
                        "on-tertiary-fixed-variant": "#573000",
                        "tertiary-container": "#fe9400",
                        "on-error": "#490006",
                        "surface-container-highest": "#262626",
                        "primary-fixed-dim": "#5191ff",
                        "primary-container": "#6c9fff",
                        "on-primary-container": "#00214f",
                        "on-surface-variant": "#adaaaa",
                        "secondary-fixed-dim": "#ffaeb2",
                        "inverse-surface": "#fcf8f8",
                        "surface-container-high": "#201f1f",
                        "surface-tint": "#85adff",
                        "on-secondary-container": "#fff6f5",
                        "secondary-container": "#be0036",
                        "primary": "#85adff",
                        "on-primary-fixed-variant": "#002a61",
                        "on-secondary-fixed-variant": "#a4002d",
                        "primary-fixed": "#6c9fff",
                        "secondary-dim": "#e51245",
                        "error-dim": "#d7383b",
                        "background": "#0e0e0e",
                        "surface-container-lowest": "#000000",
                        "surface-dim": "#0e0e0e",
                        "error": "#ff716c",
                        "tertiary-dim": "#ea8900",
                        "surface": "#0e0e0e",
                        "on-tertiary-container": "#482600",
                        "secondary-fixed": "#ffc3c4",
                        "error-container": "#9f0519",
                        "on-background": "#ffffff",
                        "on-tertiary": "#562f00",
                        "on-surface": "#ffffff",
                        "tertiary-fixed": "#ff9817",
                        "secondary": "#ff6f7c",
                        "inverse-on-surface": "#565554",
                        "tertiary": "#ffa84f",
                        "tertiary-fixed-dim": "#ee8b00",
                        "primary-dim": "#0070eb",
                        "inverse-primary": "#005bc2",
                        "on-tertiary-fixed": "#281300",
                        "surface-container": "#1a1919",
                        "on-primary": "#002c65"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .mesh-gradient {
            background: radial-gradient(at 0% 0%, #002c65 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #49000f 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #1a1919 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #0e0e0e 0px, transparent 50%);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
        }
        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(133, 173, 255, 0.3);
            border-color: #85adff;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden">
<!-- Background Layer: Immersive Macro Visuals -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-black/50 z-10 backdrop-brightness-75"></div>
<img alt="Fresh produce macro" class="w-full h-full object-cover" data-alt="Macro close-up of fresh organic produce with glistening water droplets under soft cinematic lighting with deep shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCumaeN4A_l45D0G-D3kqmLHgd4-3tsBo-0rxm9bp9OfGbTA-lCcFbMTsVkITF2OHgWmOsFu89d8jl7FPwFv0pGTERx5rNhEBLll8k6Bv-7c33lFtn5B-FDjZ09cvzqVJdsIL_DyIynbyrglRPGjnX4boZ0ag6wdWbzZc2AjTpcEjjTvIRv5gKUg3ffgVDf1jlWFEQk0Ilzx7KVJDXq46WOghnvSpED0z6jnWinIzS0e0E5sjGl_9iNS3_kiguBsTqqE0f-aTflKlAH"/>
<div class="absolute inset-0 mesh-gradient opacity-60 mix-blend-overlay"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-20 min-h-screen flex flex-col items-center justify-center px-6">
<!-- Center Auth Card -->
<div class="glass-panel w-full max-w-[440px] rounded-[32px] p-10 flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-10 text-center">
<h1 class="font-headline italic text-4xl tracking-tighter text-white mb-2">SuperMarché</h1>
<p class="font-headline text-white/60 text-lg font-light tracking-wide">Bon retour</p>
</div>
<!-- Authentication Form -->
<form class="w-full space-y-4">
<!-- Email Field -->
<div class="relative group">
<div class="absolute left-5 top-1/2 -translate-y-1/2 text-white/30 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full h-14 pl-14 pr-6 bg-white/5 border border-white/10 rounded-full text-white placeholder:text-white/30 focus:outline-none focus:ring-0 input-glow transition-all font-body text-lg" placeholder="Email" type="email"/>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="absolute left-5 top-1/2 -translate-y-1/2 text-white/30 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full h-14 pl-14 pr-6 bg-white/5 border border-white/10 rounded-full text-white placeholder:text-white/30 focus:outline-none focus:ring-0 input-glow transition-all font-body text-lg" placeholder="Mot de passe" type="password"/>
</div>
<!-- Main Action -->
<button class="w-full h-14 bg-white text-black font-bold rounded-full mt-4 hover:bg-neutral-200 transition-colors relative overflow-hidden group" type="submit">
<span class="relative z-10">Se connecter</span>
<div class="absolute inset-0 shimmer opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-8">
<div class="h-[1px] flex-1 bg-white/20"></div>
<span class="font-label text-xs uppercase tracking-widest text-white/40">ou</span>
<div class="h-[1px] flex-1 bg-white/20"></div>
</div>
<!-- Social Providers -->
<div class="w-full space-y-3">
<button class="w-full h-14 bg-black border border-white/10 text-white rounded-full flex items-center justify-center gap-3 hover:bg-neutral-900 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-body font-medium">Continuer avec Apple</span>
</button>
<button class="w-full h-14 bg-transparent border border-white/20 text-white rounded-full flex items-center justify-center gap-3 hover:bg-white/5 transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
<span class="font-body font-medium">Continuer avec Google</span>
</button>
</div>
<!-- Footer Links -->
<div class="mt-10 text-center">
<p class="font-body text-white/50">
                    Pas encore de compte ? 
                    <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4" href="#">Créer un compte</a>
</p>
</div>
</div>
<!-- Global Utilities (Suppressed Nav - Transactional Screen) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-panel px-8 py-3 rounded-full flex items-center gap-6 border border-white/5">
<a class="font-label text-[10px] uppercase tracking-widest text-white/60 hover:text-white transition-colors" href="#">Besoin d'aide?</a>
<div class="w-[1px] h-3 bg-white/20"></div>
<a class="font-label text-[10px] uppercase tracking-widest text-white/60 hover:text-white transition-colors" href="#">Confidentialité</a>
</div>
</main>
<!-- Visual Embellishment: Cinematic Glow -->
<div class="fixed -bottom-40 -left-40 w-96 h-96 bg-primary-container/20 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed -top-40 -right-40 w-96 h-96 bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
</body></html>
